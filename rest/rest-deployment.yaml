apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest
  labels:
    app: rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rest
  template:
    metadata:
      labels:
        app: rest
    spec:
      containers:
      - name: rest
        image: lookitsluc/demucs-rest:v1  # Update with your Docker Hub username and tag
        imagePullPolicy: Always
        ports:
        - containerPort: 50001
        resources:
          requests:
            cpu: "100m"
            memory: "512Mi"
        env:
          - name: REDIS_HOST
            value: "redis"
          - name: REDIS_PORT
            value: "6379"
          - name: MINIO_ENDPOINT
            value: "minio:9000"
